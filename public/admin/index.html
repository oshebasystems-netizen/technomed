<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكنوميد | لوحة تحكم الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/admin.css">
    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

    <div id="login-container" class="login-container">
        <div class="login-box">
            <div class="logo">
                <i class="fa-solid fa-microchip"></i> تكنو<span>ميد</span>
            </div>
            <h2>تسجيل الدخول للإدارة</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" value="admin" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required>
                    <small style="color: #666;">()</small>
                </div>
                <button type="submit" class="btn-primary">دخول <i class="fa-solid fa-arrow-left"></i></button>
            </form>
            <div id="login-error" class="error-msg hidden"></div>
        </div>
    </div>

    <div id="dashboard-container" class="dashboard-container hidden">
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-microchip"></i> تكنو<span>ميد</span>
            </div>
            <ul class="sidebar-menu">
                <li class="active"><a href="#"><i class="fa-solid fa-table-list"></i> الحجوزات</a></li>
                <li><a href="/" target="_blank"><i class="fa-solid fa-globe"></i> فتح الموقع</a></li>
                <li style="margin-top: auto;"><a href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i>
                        تسجيل الخروج</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2>إدارة الحجوزات</h2>
                <div class="user-info">
                    <span>مرحباً، مدير النظام</span>
                    <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
                </div>
            </header>

            <div class="content-wrapper">
                <!-- Analytics Cards -->
                <div class="stats-cards"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px;">
                    <div class="card">
                        <div class="card-icon"><i class="fa-solid fa-calendar-check"></i></div>
                        <div class="card-info">
                            <h3>إجمالي الحجوزات</h3>
                            <span id="total-bookings">0</span>
                        </div>
                    </div>
                    <div class="card" style="padding: 10px;">
                        <!-- Chart Canvas -->
                        <canvas id="servicesChart" style="max-height: 120px; width: 100%;"></canvas>
                    </div>
                </div>

                <!-- Search & Filters -->
                <div class="filter-bar"
                    style="display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                    <div class="search-box" style="flex: 1; max-width: 350px; position: relative;">
                        <i class="fa-solid fa-search"
                            style="position: absolute; right: 15px; top: 12px; color: #8892B0;"></i>
                        <input type="text" id="search-input" placeholder="ابحث بالاسم أو رقم الهاتف..."
                            style="width: 100%; padding: 10px 40px 10px 15px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; font-size: 1rem; outline: none;">
                    </div>

                    <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                        <label style="font-weight: 700; color: var(--clr-navy);">تصفية حسب الحالة:</label>
                        <select id="status-filter"
                            style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; font-size: 1rem; outline: none;">
                            <option value="الكل">الكل</option>
                            <option value="قيد الانتظار">قيد الانتظار</option>
                            <option value="تم التواصل">تم التواصل</option>
                            <option value="مكتمل">مكتمل</option>
                            <option value="ملغي">ملغي</option>
                        </select>
                        <button id="export-btn" class="btn-primary"
                            style="padding: 10px 20px; border-radius: 8px; border: none; font-size: 1rem; cursor: pointer; background: #28a745; color: white;">
                            <i class="fa-solid fa-file-excel"></i> تصدير إكسيل
                        </button>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table class="bookings-table" id="bookings-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الاسم</th>
                                <th>رقم الهاتف</th>
                                <th>الخدمة</th>
                                <th>التاريخ المفضل</th>
                                <th>التفاصيل</th>
                                <th>تاريخ الطلب</th>
                                <th>الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="bookings-tbody">
                            <!-- Data will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/admin/admin.js"></script>
</body>

</html>
